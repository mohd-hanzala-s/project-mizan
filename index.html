<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10B981" />
    <meta
      name="description"
      content="Mizan by Mikarsh — know exactly where every rupee goes, in under thirty seconds. Offline-first, private, no cloud dependency."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mizan" />
    <title>Mizan by Mikarsh</title>
    <script>
      // Pre-paint theme application (avoids a flash of the wrong theme
      // while Dexie/React are still loading). Settings in IndexedDB remain
      // the source of truth — see src/theme/ThemeProvider.tsx.
      (function () {
        try {
          var cached = localStorage.getItem("mizan-theme-cache");
          var resolved =
            cached ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          if (resolved === "dark")
            document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
